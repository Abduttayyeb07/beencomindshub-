services:
  gateway-db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: litellm
      POSTGRES_USER: litellm
      POSTGRES_PASSWORD: ${LITELLM_DATABASE_PASSWORD:?set LITELLM_DATABASE_PASSWORD}
    volumes:
      - gateway-db:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U litellm -d litellm"]
      interval: 10s
      timeout: 5s
      retries: 10

  model-gateway:
    image: docker.litellm.ai/berriai/litellm:main-stable
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    environment:
      AWS_REGION: ${AWS_REGION:-us-east-1}
      AWS_DEFAULT_REGION: ${AWS_REGION:-us-east-1}
      DATABASE_URL: postgresql://litellm:${LITELLM_DATABASE_PASSWORD}@gateway-db:5432/litellm
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      LITELLM_MAX_MONTHLY_BUDGET: ${LITELLM_MAX_MONTHLY_BUDGET:-100}
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    depends_on:
      gateway-db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4000/health/liveliness', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ../..
      dockerfile: docker/api.Dockerfile
    environment:
      COWORK_SERVER_HOST: "0.0.0.0"
      COWORK_SERVER_PORT: "26866"
      DATABASE_URI: "sqlite:////home/cowork/.cowork/cowork.db"
      COWORK_MANAGED_ENABLED: "true"
      COWORK_MANAGED_BASE_URL: "http://model-gateway:4000/v1"
      COWORK_MANAGED_API_KEY: ${LITELLM_MASTER_KEY:?set LITELLM_MASTER_KEY}
      COWORK_MANAGED_PLANNING_MODEL: ${COWORK_PLANNING_MODEL:-planning}
      COWORK_MANAGED_CODING_MODEL: ${COWORK_CODING_MODEL:-coding}
    volumes:
      - cowork-data:/home/cowork/.cowork
    depends_on:
      model-gateway:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:26866/api/v1/health/', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 10

  web:
    build:
      context: ../..
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  login:
    image: quay.io/oauth2-proxy/oauth2-proxy:v7.12.0
    environment:
      OAUTH2_PROXY_PROVIDER: oidc
      OAUTH2_PROXY_OIDC_ISSUER_URL: ${OIDC_ISSUER_URL:?set OIDC_ISSUER_URL}
      OAUTH2_PROXY_CLIENT_ID: ${OIDC_CLIENT_ID:?set OIDC_CLIENT_ID}
      OAUTH2_PROXY_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:?set OIDC_CLIENT_SECRET}
      OAUTH2_PROXY_COOKIE_SECRET: ${OIDC_COOKIE_SECRET:?set OIDC_COOKIE_SECRET}
      OAUTH2_PROXY_COOKIE_SECURE: "true"
      OAUTH2_PROXY_EMAIL_DOMAINS: "*"
      OAUTH2_PROXY_HTTP_ADDRESS: "0.0.0.0:4180"
      OAUTH2_PROXY_UPSTREAMS: "http://web:80"
      OAUTH2_PROXY_REVERSE_PROXY: "true"
      OAUTH2_PROXY_SET_XAUTHREQUEST: "true"
    ports:
      - "3000:4180"
    depends_on:
      - web
    restart: unless-stopped

volumes:
  cowork-data:
  gateway-db:

